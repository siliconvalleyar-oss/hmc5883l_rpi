[app]
name = HMC5883L_SPI_App
version = 1.0.0
log_level = INFO
log_file = /var/log/hmc5883l_app.log

[hardware]
sensor = HMC5883L
interface = SPI
chip_select = 0
clock_divider = 64
data_mode = MODE0
bit_order = MSBFIRST

[sensor]
gain = 1.3
data_rate = 15
samples_avg = 8
mode = continuous

[display]
enabled = false
type = SSD1306
address = 0x3C
